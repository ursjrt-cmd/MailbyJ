<body>
  <div id="app"><div class="loading-screen"><div><div class="loading-mark"></div><p>AERO.IST • Mail systems</p></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
  (() => {
    const app = document.getElementById('app');
    const state = { client:null, session:null, config:null, profile:null, user:null, mailboxes:[], mailbox:null, folder:'inbox', messages:[], counts:{}, query:'', selected:null, compose:null, theme:localStorage.getItem('aero-theme') || 'light', loading:false };
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials = value => String(value || 'A').trim().split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('') || 'A';
    const fmtDate = value => { if(!value) return ''; const d=new Date(value); if(Number.isNaN(+d)) return ''; const now=new Date(); return d.toDateString()===now.toDateString()?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([], {month:'short',day:'numeric'}); };
    const fmtLong = value => value ? new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}) : '';
    const formatSize = value => { const n=Number(value||0); return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(0)} KB`:`${(n/1048576).toFixed(1)} MB`; };
    const icon = (name) => ({inbox:'▣',starred:'☆',sent:'➤',drafts:'▤',archive:'▱',spam:'⚑',trash:'♲',settings:'⚙',search:'⌕',refresh:'↻',back:'←',more:'···',attach:'⌁',reply:'↶',forward:'↗',sun:'☼',moon:'☾',menu:'☰',mail:'✉',plus:'＋'}[name] || '•');
    function toast(message, type='') { const old=$('.toast'); if(old)old.remove(); const node=document.createElement('div'); node.className=`toast ${type}`; node.textContent=message; document.body.append(node); setTimeout(()=>node.remove(),3600); }
    function brandMark(){return `<div class="brand-symbol"><svg viewBox="0 0 32 32" fill="none"><path d="M4 17.2 27.5 5l-7.6 22-4.1-8.1L4 17.2Z" fill="white"/><path d="m15.8 18.8 7.1-7.2" stroke="#e83d4d" stroke-width="1.7" stroke-linecap="round"/></svg></div>`;}
    async function readJsonResponse(response, endpoint){
      const raw=await response.text();
      let payload=null;
      try{payload=raw?JSON.parse(raw):{};}catch(_error){
        const preview=raw.replace(/\s+/g,' ').slice(0,140);
        if(response.status===404 || /not found/i.test(preview)){
          throw new Error(`AERO.IST backend API was not found at ${endpoint} (HTTP ${response.status}). Your page is loading, but the Node.js API is not running on this same Render service. In Render, deploy this project as a Node Web Service (not a Static Site), with Build Command: npm install, Start Command: npm start, and Health Check Path: /api/health. Also check the Root Directory contains package.json and server.js. This is a deployment/API routing issue, not a Supabase-key error.`);
        }
        throw new Error(`The backend returned a non-JSON response at ${endpoint} (HTTP ${response.status}): ${preview||'empty response'}. Check the Render service logs and API route.`);
      }
      if(!response.ok)throw new Error(payload?.error||`Request failed at ${endpoint} (HTTP ${response.status}).`);
      return payload;
    }
    function explainSupabaseError(error){
      const message=String(error?.message||error||'Supabase request failed.');
      if(/unregistered api key|invalid api key|api key.*(invalid|unregistered)/i.test(message)){
        return 'Supabase rejected the public API key. In Render → your AERO.IST Web Service → Environment, set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY using values copied from the SAME Supabase project. The browser key must start with sb_publishable_ (or use that project’s legacy anon key). Do not put sb_secret_ or service_role in SUPABASE_PUBLISHABLE_KEY. Remove any stale duplicate key variable, save, and redeploy.';
      }
      return message;
    }
    async function loadConfig(){
      let response;
      try{response=await fetch('/api/config',{cache:'no-store',headers:{Accept:'application/json'}});}
      catch(error){throw new Error(`Could not reach the AERO.IST backend: ${error.message}. Check that the Render Node Web Service is running and that mail.aero.ist is attached to that service.`);}
      state.config=await readJsonResponse(response,'/api/config');
      if(!state.config.backend || state.config.backend!=='node-express')throw new Error('The website is connected to an unexpected server. Attach mail.aero.ist to the AERO.IST Node Web Service that runs server.js.');
      if(!state.config.supabaseUrl||!state.config.supabaseAnonKey||!state.config.supabaseReady){const missing=Array.isArray(state.config.supabaseMissing)?state.config.supabaseMissing:[];const details=missing.length?`Missing or invalid Render environment variable(s): ${missing.join(', ')}.`:'The Supabase project URL and public anon/publishable key are not available to this application.';throw new Error(details+' Open Render → your AERO.IST Node Web Service → Environment, add the values, Save Changes, and redeploy.');}
      if(!window.supabase?.createClient)throw new Error('The Supabase browser SDK did not load. Check the browser connection and allow cdn.jsdelivr.net.');
      state.client=window.supabase.createClient(state.config.supabaseUrl,state.config.supabaseAnonKey);
      const {data,error}=await state.client.auth.getSession();if(error)throw new Error(`Supabase connection failed: ${explainSupabaseError(error)}`);
      state.session=data.session;
      state.client.auth.onAuthStateChange((_event,session)=>{state.session=session;if(session){bootApp().catch(e=>toast(explainSupabaseError(e),'error'));}else{state.user=null;state.mailboxes=[];state.mailbox=null;renderAuth();}});
      if(state.session)await bootApp();else renderAuth();
    }
    async function api(url, options={}) { const {data:{session}}=await state.client.auth.getSession(); const headers={...(options.headers||{}),Accept:'application/json'}; if(session?.access_token) headers.Authorization=`Bearer ${session.access_token}`; if(options.body && !(options.body instanceof FormData)) headers['Content-Type']='application/json'; const response=await fetch(url,{...options,headers}); return await readJsonResponse(response,url); }
    function renderAuth(mode='login', notice=''){
      const signup=mode==='signup';
      app.innerHTML=`<main class="auth-wrap"><section class="auth-visual"><div class="brand-lockup">${brandMark()}<div class="brand-name">AERO.IST<span>FLIGHT-READY COMMUNICATION</span></div></div><div class="visual-copy"><div class="eyebrow">Your digital flight deck</div><h1>Clear skies.<br><em>Clear communication.</em></h1><div class="flight-line"></div><p>A calmer, smarter workspace for every conversation. Built around your domain, designed for the way the world moves.</p></div><div class="visual-bottom"><span>SECURE CLOUD MAIL</span><span>ENGINEERED FOR MOMENTUM · AERO.IST</span></div></section><section class="auth-panel"><form class="auth-card" id="auth-form"><div class="eyebrow" style="color:#dc3c4d;margin-bottom:12px">AERO.IST MAIL</div><h2>${signup?'Create your account':'Welcome back'}</h2><p class="auth-sub">${signup?'Create your account first. You can choose your AERO.IST mailbox address after signing in.':'Sign in to your AERO.IST mail workspace.'}</p>${notice?`<div class="notice ${notice.startsWith('✓')?'success':''}">${esc(notice)}</div>`:''}${signup?`<div class="field"><label for="auth-name">Your name</label><input id="auth-name" name="name" autocomplete="name" placeholder="Full name" required maxlength="120"></div>`:''}<div class="field"><label for="auth-email">Login email</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="At least 8 characters" minlength="8" required></div><button class="primary-btn wide" type="submit">${signup?'Create secure account':'Sign in to AERO.IST'} <span style="margin-left:7px">→</span></button><div class="auth-foot"><span>${signup?'Already have an account?':'New to AERO.IST Mail?'}</span><button type="button" class="quiet-btn" data-auth-mode="${signup?'login':'signup'}">${signup?'Sign in':'Create account'}</button></div>${!signup?`<div style="text-align:center;margin-top:9px"><button class="quiet-btn" type="button" data-action="forgot-password">Forgot password?</button></div>`:''}<div style="border-top:1px solid #edf1f5;margin-top:24px;padding-top:17px;text-align:center;font-size:10px;color:#9aa5b3">Protected account access · AERO.IST Mail</div></form></section></main>`;
      $('#auth-form').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const email=String(fd.get('email')).trim();const password=String(fd.get('password'));const name=String(fd.get('name')||'').trim();const btn=$('button[type=submit]',e.currentTarget);btn.disabled=true;btn.textContent='Please wait…';try{if(signup){const {data,error}=await state.client.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)throw error;if(!data.session){renderAuth('login','✓ Account created. Check your login email for the verification link, then sign in.');return;}toast('Account created successfully.','success');}else{const {error}=await state.client.auth.signInWithPassword({email,password});if(error)throw error;}}catch(err){renderAuth(mode,explainSupabaseError(err));}finally{if($('#auth-form')){$('button[type=submit]',$('#auth-form')).disabled=false;}}});
    }
    async function bootApp(){if(!state.session)return;try{const data=await api('/api/me');state.user=data.user;state.profile=data.profile||{};state.mailboxes=data.mailboxes||[];if(!state.mailbox||!state.mailboxes.some(x=>x.id===state.mailbox.id))state.mailbox=state.mailboxes[0]||null;if(!state.mailbox){renderMailboxSetup();return;}document.body.classList.toggle('dark',state.theme==='dark');await refresh();}catch(error){renderAuth('login',error.message);}}
    function renderMailboxSetup(){app.innerHTML=`<main style="min-height:100vh;background:#f2f6fa;padding:25px"><header class="brand-lockup" style="max-width:1100px;margin:12px auto 0">${brandMark()}<div class="brand-name" style="color:#102540">AERO.IST<span style="color:#8da0b3">MAIL WORKSPACE</span></div><button class="quiet-btn" style="margin-left:auto" data-action="signout">Sign out</button></header><section class="setup-card"><div class="eyebrow" style="color:#dc3d4d">YOUR FIRST MAILBOX</div><h2>Create your AERO.IST email</h2><p>Choose the address you want people to contact. This creates a mailbox in your AERO.IST workspace. The domain must be verified and its receiving DNS must be active before external emails can arrive.</p><div class="field"><label for="mailbox-local">Email address</label><input id="mailbox-local" placeholder="yourname" maxlength="30" autocomplete="off"><div class="address-preview"><span id="address-prefix">yourname</span>@${esc(state.config.mailboxDomain)}</div><div class="domain-hint">Available domain: ${esc(state.config.mailboxDomain)} · Your account can create up to 3 addresses.</div></div><div class="field"><label for="mailbox-display">Display name</label><input id="mailbox-display" placeholder="Your name or team name" maxlength="80" value="${esc(state.profile?.display_name||'')}"></div><button class="primary-btn wide" data-action="create-mailbox">Create my mailbox →</button><div id="setup-notice"></div><div style="margin-top:20px;text-align:center"><button class="quiet-btn" data-action="signout">Sign out</button></div></section></main>`;$('#mailbox-local').addEventListener('input',e=>$('#address-prefix').textContent=e.target.value.toLowerCase().replace(/[^a-z0-9._-]/g,'')||'yourname');}
    async function refresh(){if(!state.mailbox)return;state.loading=true;renderShell();try{const [list,counts]=await Promise.all([api(`/api/messages?mailboxId=${encodeURIComponent(state.mailbox.id)}&folder=${encodeURIComponent(state.folder)}&q=${encodeURIComponent(state.query)}`),api(`/api/folders/counts?mailboxId=${encodeURIComponent(state.mailbox.id)}`)]);state.messages=list.messages||[];state.counts=counts.counts||{};renderShell();}catch(e){toast(e.message,'error');}finally{state.loading=false;}}
    function folderTitle(){return ({inbox:'Inbox',starred:'Starred',sent:'Sent',drafts:'Drafts',archive:'Archive',spam:'Spam',trash:'Trash',all:'All mail'}[state.folder]||'Inbox');}
    function renderShell(){document.body.classList.toggle('dark',state.theme==='dark');app.innerHTML=`<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="side-brand">${brandMark()}<div class="brand-name">AERO.IST<span>MAIL</span></div></div><button class="compose-btn" data-action="compose"><span>＋</span> Compose message</button><div class="nav-label">Mail workspace</div>${[['inbox','▣','Inbox'],['starred','☆','Starred'],['sent','➤','Sent'],['drafts','▤','Drafts'],['archive','▱','Archive'],['spam','⚑','Spam'],['trash','♲','Trash']].map(([id,ic,name])=>`<button class="nav-item ${state.folder===id?'active':''}" data-folder="${id}"><span class="nav-icon">${ic}</span>${name}<span class="nav-count">${Number(state.counts[id]||0)?state.counts[id]:''}</span></button>`).join('')}<div class="mailbox-card"><small>Active mailbox</small><select class="mailbox-select" id="mailbox-switch">${state.mailboxes.map(m=>`<option value="${esc(m.id)}" ${m.id===state.mailbox.id?'selected':''}>${esc(m.email)}</option>`).join('')}</select><button class="quiet-btn" style="color:#79bce0;padding:10px 0 0" data-action="new-mailbox">＋ Add another address</button></div><div class="side-bottom"><div class="security-note"><strong>✦ AERO.IST Secure Mail</strong>Your private workspace for important communications.</div><div class="profile-mini"><div class="avatar">${esc(initials(state.profile?.display_name||state.user?.email))}</div><div><strong>${esc(state.profile?.display_name||'AERO.IST User')}</strong><span>${esc(state.user?.email||'')}</span></div><button title="Settings" data-action="settings">⚙</button></div></div></aside><div class="mobile-sidebar-backdrop" id="sidebar-backdrop"></div><section class="workspace"><header class="topbar"><button class="mobile-menu" data-action="mobile-menu">☰</button><div class="search-wrap"><span class="search-icon">⌕</span><input id="search-box" placeholder="Search mail, people and attachments" value="${esc(state.query)}"><span style="position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:9px;color:#a1adbb">ENTER</span></div><div class="top-actions"><button class="icon-btn" title="Refresh" data-action="refresh">↻</button><button class="icon-btn" title="Toggle theme" data-action="theme">${state.theme==='dark'?'☼':'☾'}</button><div class="top-divider"></div><button class="top-user" data-action="settings"><div class="avatar">${esc(initials(state.profile?.display_name||state.user?.email))}</div><span>${esc((state.profile?.display_name||'Account').split(' ')[0])}</span></button></div></header><main class="content-area" id="content">${state.selected?renderMessageView():renderList()}</main></section></div>`;
      $('#mailbox-switch').addEventListener('change',e=>{state.mailbox=state.mailboxes.find(m=>m.id===e.target.value)||state.mailboxes[0];state.selected=null;refresh();});
      $('#search-box').addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=e.target.value.trim();refresh();}});
      $('#sidebar-backdrop').addEventListener('click',closeMobileMenu);
    }
    function renderList(){const label=folderTitle();const rows=state.messages.map(m=>{const sender=m.direction==='outbound'?(m.to_recipients||[]).map(x=>x.email).join(', ')||'No recipient':(m.from_name?`${m.from_name} · `:'')+m.from_email;return `<div class="list-row ${m.is_read?'':'unread'}" data-open="${esc(m.id)}"><input class="row-check" type="checkbox" aria-label="Select message" data-stop-row="true"><button class="star-btn ${m.is_starred?'starred':''}" data-action="star-message" data-id="${esc(m.id)}" title="Star">${m.is_starred?'★':'☆'}</button><div class="sender">${esc(sender)}</div><div class="subject-line"><span class="subject">${esc(m.subject||'(no subject)')}</span><span class="preview"> — ${esc(m.snippet||'')}</span>${(m.attachments||[]).length?'<span class="attachment-dot">⌁</span>':''}</div><div class="row-date">${esc(fmtDate(m.created_at||m.sent_at||m.received_at))}</div></div>`;}).join('');return `<div class="page-heading"><div><h1>${esc(label)}</h1><p>${esc(state.mailbox.email)} <span style="margin:0 5px;color:#c4ced8">/</span> ${state.folder==='inbox'?'Your latest conversations':state.folder==='sent'?'Messages you have sent':`Your ${label.toLowerCase()} messages`}</p></div><div class="heading-actions"><button class="outline-btn" data-action="refresh">↻ <span class="hide-mobile">Refresh</span></button><button class="outline-btn" data-action="settings">⚙ <span class="hide-mobile">Settings</span></button></div></div><section class="inbox-card"><div class="list-toolbar"><span class="toolbar-title">${state.loading?'Loading…':`${state.messages.length} ${state.messages.length===1?'message':'messages'}`}<span class="toolbar-sub">${state.query?`Matching “${esc(state.query)}”`:''}</span></span><button class="icon-btn" style="width:32px;height:32px" title="Refresh list" data-action="refresh">↻</button><button class="icon-btn" style="width:32px;height:32px" title="Settings" data-action="settings">⋯</button></div>${state.loading?`<div style="padding:22px;display:grid;gap:20px">${[1,2,3,4,5].map(()=>'<div class="skeleton" style="width:100%;height:37px"></div>').join('')}</div>`:rows||`<div class="empty-state"><div class="empty-icon">${state.folder==='inbox'?'✉':'⌑'}</div><h3>${state.query?'No matching messages':`No messages in ${label.toLowerCase()}`}</h3><p>${state.query?'Try another search term or clear your search.':'When messages arrive in this mailbox, they will appear here. You can also compose a new message to get started.'}</p>${state.folder==='inbox'?'<button class="primary-btn" data-action="compose">Compose a message</button>':''}</div>`}<div class="list-footer"><span>Showing ${state.messages.length} recent messages</span><span>Private mailbox · AERO.IST</span></div></section>`;}
    function renderMessageView(){const m=state.selected;const senderName=m.from_name||m.from_email||'Unknown sender';const recipientText=(m.to_recipients||[]).map(x=>x.email).join(', ');const safeHtml=m.body_html?(window.DOMPurify?DOMPurify.sanitize(m.body_html,{FORBID_TAGS:['script','style','iframe','object','embed','form','input','button','video','audio','img'],FORBID_ATTR:['onerror','onclick','onload','style']}).replace(/<a /gi,'<a target="_blank" rel="noopener noreferrer" '):`<pre style="white-space:pre-wrap;font-family:inherit">${esc(m.body_text||'')}</pre>`):`<pre style="white-space:pre-wrap;font-family:inherit">${esc(m.body_text||'')}</pre>`;return `<div class="page-heading"><div><h1>Message</h1><p>${esc(state.mailbox.email)} <span style="margin:0 5px;color:#c4ced8">/</span> ${esc(folderTitle())}</p></div><div class="heading-actions"><button class="outline-btn" data-action="close-message">← <span class="hide-mobile">Back to ${esc(folderTitle())}</span></button></div></div><section class="message-card"><div class="message-toolbar"><button class="icon-btn" title="Back" data-action="close-message">←</button><button class="icon-btn" title="Archive" data-action="message-action" data-id="${esc(m.id)}" data-value="archive">▱</button><button class="icon-btn" title="Move to trash" data-action="message-action" data-id="${esc(m.id)}" data-value="trash">♲</button><button class="icon-btn" title="Mark unread" data-action="message-action" data-id="${esc(m.id)}" data-value="unread">✉</button><div class="toolbar-right"><button class="icon-btn" title="${m.is_starred?'Unstar':'Star'}" data-action="star-message" data-id="${esc(m.id)}">${m.is_starred?'★':'☆'}</button><button class="icon-btn" title="More" data-action="message-more" data-id="${esc(m.id)}">···</button></div></div><div class="message-main"><h2 class="message-subject">${esc(m.subject||'(no subject)')}</h2><div class="message-meta"><div class="avatar">${esc(initials(senderName))}</div><div class="meta-main"><div class="meta-top"><strong>${esc(senderName)}</strong><span>${esc(m.from_email||'')}</span></div><div class="meta-detail">To: ${esc(recipientText||state.mailbox.email)} ${m.cc_recipients?.length?` · Cc: ${esc(m.cc_recipients.map(x=>x.email).join(', '))}`:''}<br>${esc(fmtLong(m.created_at||m.sent_at||m.received_at))}</div></div></div><div class="message-body">${safeHtml}</div>${(m.attachments||[]).length?`<div class="message-attachments"><div style="width:100%;font-size:10px;color:#91a0b0;font-weight:700">ATTACHMENTS · ${m.attachments.length}</div>${m.attachments.map((a,i)=>`<div class="attachment-chip"><div class="file-mark">⌁</div><div><strong>${esc(a.filename||`Attachment ${i+1}`)}</strong><span>${formatSize(a.size)}</span></div><button data-action="download-attachment" data-path="${esc(a.path||'')}" data-name="${esc(a.filename||'attachment')}">Download</button></div>`).join('')}</div>`:''}<div class="message-replybar">${m.direction==='inbound'?`<button class="outline-btn" data-action="reply">↶ Reply</button><button class="outline-btn" data-action="forward">↗ Forward</button>`:`<button class="outline-btn" data-action="forward">↗ Forward</button>`}</div></div></section>`;}
    function closeMobileMenu(){$('#sidebar')?.classList.remove('open');$('#sidebar-backdrop')?.classList.remove('show');}
    function showModal(content,small=false){const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';backdrop.innerHTML=`<div class="modal ${small?'small':''}" role="dialog" aria-modal="true">${content}</div>`;document.body.append(backdrop);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});}
    function closeModal(){$('#modal-backdrop')?.remove();state.compose=null;}
    function openCompose(seed={}){state.compose={id:seed.id||null,attachments:(seed.attachments||[]).map(x=>({...x})),busy:false};const to=(seed.to||[]).map(x=>x.email||x).join(', ');const cc=(seed.cc||[]).map(x=>x.email||x).join(', ');const bcc=(seed.bcc||[]).map(x=>x.email||x).join(', ');showModal(`<div class="modal-head"><strong>${seed.id?'Edit draft':seed.reply?'Reply':seed.forward?'Forward message':'New message'}</strong><span>From ${esc(state.mailbox.email)}</span><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-body"><div class="compose-fields"><div class="compose-line"><label>To</label><input id="compose-to" value="${esc(to)}" placeholder="Recipient email addresses"></div><div class="compose-line" id="cc-line" style="${cc?'':'display:none'}"><label>Cc</label><input id="compose-cc" value="${esc(cc)}" placeholder="Carbon copy"></div><div class="compose-line" id="bcc-line" style="${bcc?'':'display:none'}"><label>Bcc</label><input id="compose-bcc" value="${esc(bcc)}" placeholder="Blind carbon copy"></div><div class="compose-line"><label>Subject</label><input id="compose-subject" value="${esc(seed.subject||'')}" placeholder="Add a subject"></div></div><div class="compose-editor" id="compose-editor" contenteditable="true" data-placeholder="Write your message…">${seed.html||''}</div><div class="editor-tools"><button title="Bold" data-editor-cmd="bold"><b>B</b></button><button title="Italic" data-editor-cmd="italic"><i>I</i></button><button title="Underline" data-editor-cmd="underline"><u>U</u></button><button title="Bulleted list" data-editor-cmd="insertUnorderedList">☷</button><button title="Numbered list" data-editor-cmd="insertOrderedList">1.</button><button title="Insert link" data-action="insert-link">↗</button><button title="Clear formatting" data-editor-cmd="removeFormat">Tx</button><button class="toggle" style="margin-left:auto;width:auto" data-action="toggle-cc">Cc</button><button class="toggle" style="width:auto" data-action="toggle-bcc">Bcc</button><button title="Attach files" data-action="choose-files">⌁</button><input type="file" id="compose-files" multiple class="hidden"></div><div id="compose-attachments">${renderComposeAttachments()}</div></div><div class="modal-foot"><button class="primary-btn" data-action="send-message">➤ Send</button><button class="outline-btn" data-action="save-draft">Save draft</button><span class="spacer"></span><button class="icon-btn" title="Discard draft" data-action="discard-draft">♲</button></div>`);$('#compose-files').addEventListener('change',handleChosenFiles);}
    function renderComposeAttachments(){return (state.compose?.attachments||[]).map((a,i)=>`<span class="file-pill">⌁ ${esc(a.filename)} <span style="color:#9aa7b6">${formatSize(a.size)}</span><button data-action="remove-compose-file" data-index="${i}" title="Remove">×</button></span>`).join('');}
    async function uploadFiles(files){const {data:{session}}=await state.client.auth.getSession();if(!session)throw new Error('Sign in again to upload files.');let total=(state.compose.attachments||[]).reduce((n,a)=>n+Number(a.size||0),0);for(const file of files){total+=file.size;if(total>Number((state.config?.maxAttachmentMB||20)*1024*1024))throw new Error(`The total attachment size is limited to ${state.config?.maxAttachmentMB||20} MB.`);const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,130)||'file';const path=`${session.user.id}/outgoing/${crypto.randomUUID()}_${safe}`;const {error}=await state.client.storage.from('mail-attachments').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(error)throw error;state.compose.attachments.push({filename:file.name,content_type:file.type||'application/octet-stream',size:file.size,path});}$('#compose-attachments').innerHTML=renderComposeAttachments();}
    async function handleChosenFiles(e){try{await uploadFiles([...e.target.files]);}catch(err){toast(err.message,'error');}e.target.value='';}
    function collectCompose(){return {mailboxId:state.mailbox.id,id:state.compose.id,draftId:state.compose.id,to:$('#compose-to')?.value||'',cc:$('#compose-cc')?.value||'',bcc:$('#compose-bcc')?.value||'',subject:$('#compose-subject')?.value||'',html:$('#compose-editor')?.innerHTML||'',text:$('#compose-editor')?.innerText||'',attachments:state.compose.attachments||[]};}
    async function sendCompose(){const data=collectCompose();const button=$('[data-action="send-message"]');button.disabled=true;button.textContent='Sending…';try{const result=await api('/api/send',{method:'POST',body:JSON.stringify(data)});closeModal();state.folder='sent';state.selected=null;await refresh();toast(result.warning||'Message sent successfully.','success');}catch(e){toast(e.message,'error');button.disabled=false;button.textContent='➤ Send';}}
    async function saveDraft(){const data=collectCompose();try{const result=await api('/api/drafts',{method:'POST',body:JSON.stringify(data)});state.compose.id=result.id;closeModal();state.folder='drafts';await refresh();toast('Draft saved.','success');}catch(e){toast(e.message,'error');}}
    async function openMessage(id){try{const {message}=await api(`/api/messages/${encodeURIComponent(id)}`);state.selected=message;if(message.folder==='drafts'){state.selected=null;openCompose({id:message.id,to:message.to_recipients||[],cc:message.cc_recipients||[],bcc:message.bcc_recipients||[],subject:message.subject,html:message.body_html,attachments:message.attachments||[]});return;}renderShell();}catch(e){toast(e.message,'error');}}
    async function messageAction(id,action){try{await api(`/api/messages/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action})});if(state.selected?.id===id){state.selected=null;}await refresh();toast(({archive:'Message archived',trash:'Moved to Trash',spam:'Marked as Spam',unread:'Marked unread',read:'Marked read',restore:'Message restored',permanent_delete:'Message permanently deleted'}[action])||'Message updated','success');}catch(e){toast(e.message,'error');}}
    async function downloadAttachment(path,name){try{const {url}=await api(`/api/attachments/signed?path=${encodeURIComponent(path)}`);const a=document.createElement('a');a.href=url;a.download=name||'attachment';a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();}catch(e){toast(e.message,'error');}}
    function openSettings(){showModal(`<div class="modal-head"><strong>Workspace settings</strong><span>Personalise your mail experience</span><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-body"><div class="settings-grid"><div class="field"><label>Display name</label><input id="settings-name" class="modal-field" value="${esc(state.profile?.display_name||'')}"></div><div class="field"><label>Login account</label><input class="modal-field" value="${esc(state.user?.email||'')}" disabled></div><div class="field full"><label>Default signature</label><textarea id="settings-signature" class="modal-field" rows="5" placeholder="Your name · Role · AERO.IST">${esc(state.profile?.signature||'')}</textarea></div><div class="field full"><label>Active mailbox</label><input class="modal-field" value="${esc(state.mailbox.email)}" disabled></div></div><div class="notice">Email addresses are created on <strong>${esc(state.config.mailboxDomain)}</strong>. Mail delivery requires your domain's DNS verification and the Resend integration.</div></div><div class="modal-foot"><button class="primary-btn" data-action="save-settings">Save settings</button><span class="spacer"></span><button class="outline-btn" data-action="signout">Sign out</button></div>`,true);}
    function openMessageMore(id){showModal(`<div class="modal-head"><strong>Message options</strong><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-body" style="display:grid;gap:9px"><button class="outline-btn" data-action="message-action" data-id="${esc(id)}" data-value="read">Mark as read</button><button class="outline-btn" data-action="message-action" data-id="${esc(id)}" data-value="spam">Report as spam</button><button class="outline-btn" data-action="message-action" data-id="${esc(id)}" data-value="permanent_delete">Permanently delete (only in Trash or Spam)</button></div>`,true);}
    async function handleAction(action,el){const id=el?.dataset.id;switch(action){case'compose':openCompose();break;case'close-modal':closeModal();break;case'close-message':state.selected=null;renderShell();break;case'refresh':await refresh();toast('Mailbox refreshed','success');break;case'theme':state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('aero-theme',state.theme);renderShell();break;case'settings':openSettings();break;case'mobile-menu':$('#sidebar')?.classList.toggle('open');$('#sidebar-backdrop')?.classList.toggle('show');break;case'signout':closeModal();await state.client.auth.signOut();break;case'forgot-password':{const email=prompt('Enter your login email for a password reset link:');if(email){const {error}=await state.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)toast(error.message,'error');else toast('Password reset instructions sent.','success');}break;}case'create-mailbox':{const localPart=$('#mailbox-local')?.value||'';const displayName=$('#mailbox-display')?.value||'';el.disabled=true;try{const {mailbox}=await api('/api/mailboxes',{method:'POST',body:JSON.stringify({localPart,displayName})});state.mailboxes.push(mailbox);state.mailbox=mailbox;state.folder='inbox';await refresh();toast(`Created ${mailbox.email}`,'success');}catch(e){$('#setup-notice').innerHTML=`<div class="notice">${esc(e.message)}</div>`;el.disabled=false;}break;}case'new-mailbox':renderMailboxSetup();break;case'star-message':{const row=state.messages.find(m=>m.id===id)||state.selected;const action=row?.is_starred?'unstar':'star';if(state.selected?.id===id){state.selected.is_starred=!state.selected.is_starred;renderShell();}await api(`/api/messages/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action})});await refresh();break;}case'message-action':closeModal();await messageAction(id,el.dataset.value);break;case'download-attachment':await downloadAttachment(el.dataset.path,el.dataset.name);break;case'reply':{const m=state.selected;openCompose({reply:true,to:[{email:m.from_email}],subject:(m.subject||'').startsWith('Re:')?m.subject:`Re: ${m.subject||''}`,html:`<br><br><blockquote>${esc(m.body_text||'')}</blockquote>`});break;}case'forward':{const m=state.selected;openCompose({forward:true,subject:(m.subject||'').startsWith('Fwd:')?m.subject:`Fwd: ${m.subject||''}`,html:`<br><br><p>---------- Forwarded message ----------</p><p>From: ${esc(m.from_email)}<br>Subject: ${esc(m.subject||'')}</p><blockquote>${esc(m.body_text||'')}</blockquote>`,attachments:m.attachments||[]});break;}case'send-message':await sendCompose();break;case'save-draft':await saveDraft();break;case'discard-draft':{const draftId=state.compose?.id;closeModal();if(draftId){try{await api(`/api/messages/${encodeURIComponent(draftId)}/action`,{method:'POST',body:JSON.stringify({action:'discard_draft'})});if(state.folder==='drafts')await refresh();toast('Draft discarded.','success');}catch(e){toast(e.message,'error');}}else toast('Composer closed.','');break;}case'choose-files':$('#compose-files')?.click();break;case'remove-compose-file':{const index=Number(el.dataset.index);state.compose.attachments.splice(index,1);$('#compose-attachments').innerHTML=renderComposeAttachments();break;}case'toggle-cc':{const line=$('#cc-line');line.style.display=line.style.display==='none'?'flex':'none';if(line.style.display!=='none')$('#compose-cc').focus();break;}case'toggle-bcc':{const line=$('#bcc-line');line.style.display=line.style.display==='none'?'flex':'none';if(line.style.display!=='none')$('#compose-bcc').focus();break;}case'insert-link':{const url=prompt('Enter the link URL (https://…)');if(url&&/^https?:\/\//i.test(url)){document.execCommand('createLink',false,url);}else if(url)toast('Please use a full https:// or http:// link.','error');break;}case'save-settings':{try{const {profile}=await api('/api/profile',{method:'PATCH',body:JSON.stringify({displayName:$('#settings-name').value,signature:$('#settings-signature').value})});state.profile=profile;closeModal();renderShell();toast('Settings saved.','success');}catch(e){toast(e.message,'error');}break;}case'message-more':openMessageMore(id);break;}}
    document.addEventListener('click',async e=>{const folder=e.target.closest('[data-folder]');if(folder){state.folder=folder.dataset.folder;state.selected=null;state.query='';await refresh();closeMobileMenu();return;}const editor=e.target.closest('[data-editor-cmd]');if(editor){document.execCommand(editor.dataset.editorCmd,false,null);$('#compose-editor')?.focus();return;}const action=e.target.closest('[data-action]');if(action){e.preventDefault();await handleAction(action.dataset.action,action);return;}const row=e.target.closest('[data-open]');if(row&&!e.target.closest('[data-stop-row]')){await openMessage(row.dataset.open);closeMobileMenu();}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMobileMenu();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='enter'&&$('#compose-editor')){e.preventDefault();sendCompose();}if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!$('#modal-backdrop')){if(e.key.toLowerCase()==='c'){e.preventDefault();openCompose();}if(e.key==='/'){e.preventDefault();$('#search-box')?.focus();}}});
    document.addEventListener('click',e=>{const mode=e.target.closest('[data-auth-mode]');if(mode)renderAuth(mode.dataset.authMode);});
    loadConfig().catch(err=>{const message=String(err?.message||'Unknown startup error');const backendMissing=/backend API was not found|API endpoint not found|unexpected server|Could not reach the AERO\.IST backend/i.test(message);app.innerHTML=`<main class="auth-wrap"><section class="auth-visual"><div class="brand-lockup">${brandMark()}<div class="brand-name">AERO.IST<span>MAIL</span></div></div><div class="visual-copy"><div class="eyebrow">${backendMissing?'Backend deployment':'System configuration'}</div><h1>${backendMissing?'Connect the<br> flight deck.':'Almost ready<br> for take-off.'}<br><em>${backendMissing?'API service required.':'Secure mail awaits.'}</em></h1><p>${esc(message)}</p></div></section><section class="auth-panel"><div class="auth-card"><h2>${backendMissing?'AERO.IST backend not found':'Supabase connection needed'}</h2><p class="auth-sub">${backendMissing?'The website files are loading, but the Node.js API required by the mail application is not answering.':'The backend is responding, but one or more Supabase settings are missing or invalid.'}</p><div class="notice">${esc(message)}</div><p class="auth-sub" style="margin-bottom:14px">${backendMissing?'Use a Render Node Web Service with npm install and npm start. Do not deploy this full-stack project as a Static Site.':'Use SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY), and the server-only SUPABASE_SECRET_KEY (or SUPABASE_SERVICE_ROLE_KEY). Never put the secret key in browser code or GitHub.'}</p><button class="primary-btn wide" onclick="location.reload()">Retry connection</button></div></section></main>`;});
  })();
  </script>
