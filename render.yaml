services:
  - type: web
    name: aero-ist-mail
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAILBOX_DOMAIN
        value: inbox.aero.ist
      - key: MAX_MAILBOXES_PER_USER
        value: "3"
      - key: MAX_ATTACHMENT_MB
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
